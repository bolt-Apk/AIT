<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Код подтверждения — AI-taip</title>
</head>
<body style="margin:0;padding:0;background-color:#0a0e1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#0a0e1a;min-height:100vh;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="480" cellspacing="0" cellpadding="0" style="max-width:480px;width:100%;">
          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <img src="https://ai-taip.com/icons/image.png" alt="AI-taip" width="56" height="56" style="display:block;border-radius:16px;" />
            </td>
          </tr>
          <!-- Card -->
          <tr>
            <td style="background:linear-gradient(145deg,#131929,#0f1424);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:40px 32px;">
              <!-- Icon -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" style="padding-bottom:24px;">
                    <div style="width:64px;height:64px;background:linear-gradient(135deg,#ef4444,#dc2626);border-radius:20px;display:inline-block;text-align:center;line-height:64px;font-size:28px;">
                      &#128272;
                    </div>
                  </td>
                </tr>
              </table>
              <!-- Title -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" style="padding-bottom:12px;">
                    <h1 style="margin:0;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">
                      Подтверждение действия
                    </h1>
                  </td>
                </tr>
              </table>
              <!-- Body text -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" style="padding-bottom:32px;">
                    <p style="margin:0;font-size:14px;line-height:22px;color:#94a3b8;max-width:360px;">
                      Для подтверждения вашей личности введите код ниже в приложении AI-taip.
                    </p>
                  </td>
                </tr>
              </table>
              <!-- OTP Code -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" style="padding-bottom:32px;">
                    <div style="display:inline-block;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:20px 40px;">
                      <span style="font-size:32px;font-weight:700;color:#ffffff;letter-spacing:8px;font-family:'Courier New',monospace;">
                        {{ .Token }}
                      </span>
                    </div>
                  </td>
                </tr>
              </table>
              <!-- Divider -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="border-top:1px solid rgba(255,255,255,0.06);padding-top:24px;">
                    <p style="margin:0;font-size:12px;line-height:18px;color:#475569;">
                      Если вы не запрашивали этот код, проигнорируйте письмо. Никто не получит доступ к вашему аккаунту без этого кода.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:32px;">
              <p style="margin:0;font-size:12px;color:#334155;">
                &copy; 2026 AI-taip &mdash; ИИ-платформа для создания контента
              </p>
              <p style="margin:8px 0 0;font-size:11px;">
                <a href="https://ai-taip.com" style="color:#0e7490;text-decoration:none;">AI-taip.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
